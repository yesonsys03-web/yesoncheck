# 파일 이름은 windows-build.yml 그대로 (문서·명령 `gh workflow run windows-build.yml`이 이 이름을 씀)
name: build (Windows·Mac)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # 버전(tools/write_build_info.py)을 git 태그로 정함 → 전체 기록과 태그를 받음 (기본은 커밋 하나만)
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      - name: 빌드 환경 (Python 3.10, Windows lock)
        run: |
          # 여러 줄 단계: 중간 명령이 실패(종료 코드 ≠ 0)해도 단계가 실패하도록
          $PSNativeCommandUseErrorActionPreference = $true
          uv venv .venv --python 3.10 --managed-python
          $py = ".venv\Scripts\python.exe"
          # paddle 2.6.2(Windows)는 protobuf <=3.20.2, TensorFlow 2.15는 >=3.20.3 → 설치할 때도 lock 만들 때와 같은 덮어쓰기 필요
          uv pip install --python $py -r requirements-build-windows.lock --override requirements-build-windows.overrides.txt
          # opencv 세 패키지가 같은 cv2 폴더를 씀 → contrib 판이 최종으로 남도록 재설치 (setup_build_env.sh와 같음)
          uv pip install --python $py --reinstall-package opencv-contrib-python opencv-contrib-python==4.6.0.66
          uv pip install --python $py -r requirements-test.txt
          & $py -c "import cv2; from cv2 import version; assert version.contrib and not version.headless; import paddle; print('cv2', cv2.__version__, 'paddle', paddle.__version__); paddle.utils.run_check()"
          & $py -c "import google.protobuf, tensorflow as tf; print('protobuf', google.protobuf.__version__, 'tensorflow', tf.__version__)"

      - name: ffmpeg (gyan 9.0.2)
        run: ./fetch_ffmpeg_windows.ps1

      - name: 시험용 SMB 공유
        run: ./ci/setup_test_share.ps1

      - name: 소스 시험 (pytest)
        run: .venv\Scripts\python.exe -m pytest tests -v -rs

      - name: 빌드 정보 (버전·커밋 → build\build_info.json)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # 버전: HEAD에 vX.Y.Z 태그가 있고 작업 폴더가 깨끗하면 X.Y.Z, 아니면 <가장 큰 vX.Y.Z>+<커밋 7자리>
          # 표준 출력 한 줄 = 파일 이름 꼬리 file_tag (배포판이면 X.Y.Z, 아니면 커밋 7자리). spec이 JSON을 앱에 넣음
          $fileTag = .venv\Scripts\python.exe tools\write_build_info.py --out build\build_info.json
          if (-not ($fileTag -is [string]) -or -not ($fileTag -match '^(\d+\.\d+\.\d+|[0-9a-f]{7})$')) {
            throw "write_build_info.py의 출력이 file_tag 한 줄이 아닙니다: $fileTag"
          }
          $version = (Get-Content build\build_info.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if (-not $version) { throw "build\build_info.json에 version이 없습니다" }
          # 커밋 안 된 변경이 있으면 버전 끝에 .dirty가 붙고 file_tag가 커밋 7자리가 됨 → vX.Y.Z 태그 빌드도 이름이
          # 조용히 커밋으로 바뀌므로 멈춤 (CI는 저장소 파일을 바꾸지 않음 — 무엇이 바뀌었는지 보여 줌)
          if ($version.EndsWith(".dirty")) {
            git status --porcelain | Write-Host
            throw "커밋 안 된 변경이 있는 채로 빌드 정보를 만들었습니다: $version"
          }
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_FILE_TAG=$fileTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "빌드 버전: $version (파일 이름 꼬리 $fileTag)"

      - name: PyInstaller 빌드
        run: .venv\Scripts\python.exe -m PyInstaller --clean -y YesonCheck_Autocut.spec

      - name: TensorFlow가 찾는 VC++ DLL (_internal 맨 위)
        run: |
          # TensorFlow는 import할 때(self_check.preload_check) msvcp140.dll·msvcp140_1.dll을 이름으로 불러봄
          # → VC++ 재배포 패키지가 없는 PC에서도 되도록 앱에 있어야 함 (spec이 넣음)
          foreach ($dll in @("msvcp140.dll", "msvcp140_1.dll")) {
            $path = "dist\YesonCheck_Autocut\_internal\$dll"
            if (-not (Test-Path $path)) { throw "빌드된 앱에 ${dll}이 없습니다: $path" }
            Write-Host "$path ($((Get-Item $path).Length) 바이트)"
          }

      - name: 모듈 검사
        run: .venv\Scripts\python.exe check_frozen_imports.py dist\YesonCheck_Autocut

      - name: '끊긴 기억된 네트워크 드라이브 (W: → 없는 서버 \\192.0.2.1\dead) — 두 실행 시험 모두 이 드라이브가 있는 채로'
        run: |
          # 서버가 꺼진 기억된 드라이브: 첫 확인에 20초쯤 걸림 → 창은 바로 보이고 공유 문제로만 알려야 함
          $key = "HKCU:\Network\W"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name RemotePath -PropertyType String -Value "\\192.0.2.1\dead" -Force | Out-Null
          New-ItemProperty -Path $key -Name UserName -PropertyType String -Value "" -Force | Out-Null
          New-ItemProperty -Path $key -Name ProviderName -PropertyType String -Value "Microsoft Windows Network" -Force | Out-Null
          New-ItemProperty -Path $key -Name ProviderType -PropertyType DWord -Value 0x20000 -Force | Out-Null
          New-ItemProperty -Path $key -Name ConnectionType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DeferFlags -PropertyType DWord -Value 4 -Force | Out-Null
          Get-ItemProperty -Path $key | Format-List | Out-String | Write-Host

      - name: 실행 시험 데이터 — 자동 연결 (PC별 설정·변환표 없이)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$PWD\vendor\ffmpeg\windows;$env:PATH"
          .venv\Scripts\python.exe ci\make_test_data.py --auto-connect --share-root $env:YC_TEST_SHARE_ROOT --mac-root /Volumes/yc_test --workdir C:\yc_smoke_auto --settings "$env:APPDATA\YesonCheck\settings.json" --dead-share "\\192.0.2.1\dead"

      - name: 실행 시험 — 자동 연결 (빌드된 exe)
        run: ./ci/run_smoke_test.ps1 -Workdir C:\yc_smoke_auto

      - name: 실행 시험 데이터 (시험 공유에 한글 작품 폴더·공유 설정·PC별 설정)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$PWD\vendor\ffmpeg\windows;$env:PATH"
          # --expect-version: 이 시험 데이터를 쓰는 두 실행 시험(빌드된 exe·설치된 exe)이 앱의 버전·창 제목도 확인
          .venv\Scripts\python.exe ci\make_test_data.py --share-root $env:YC_TEST_SHARE_ROOT --mac-root /Volumes/yc_test --unc $env:YC_TEST_UNC --workdir C:\yc_smoke --settings "$env:APPDATA\YesonCheck\settings.json" --expect-version $env:INSTALLER_VERSION

      - name: 실행 시험 (빌드된 exe)
        run: ./ci/run_smoke_test.ps1

      - name: Inno Setup(ISCC) 찾기
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          $known = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($cmd) {
            $isccPath = $cmd.Source
          } elseif (Test-Path $known) {
            $isccPath = $known
          } else {
            Write-Host "ISCC.exe를 찾지 못해 choco로 설치합니다"
            choco install innosetup -y --no-progress
            if (Test-Path $known) {
              $isccPath = $known
            } else {
              $cmd2 = Get-Command iscc -ErrorAction SilentlyContinue
              if ($cmd2) { $isccPath = $cmd2.Source } else { throw "choco install innosetup 이후에도 ISCC.exe를 찾을 수 없습니다" }
            }
          }
          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC: $isccPath"

      - name: 설치 파일 빌드 (Inno Setup)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:ISCC_PATH /DAppVersion="$env:INSTALLER_VERSION" /DAppFileTag="$env:INSTALLER_FILE_TAG" installer\yesoncheck.iss
          $setupExe = "installer\YesonCheck_Setup_$($env:INSTALLER_FILE_TAG).exe"
          if (-not (Test-Path $setupExe)) { throw "설치 파일이 만들어지지 않았습니다: $setupExe" }
          "SETUP_EXE=$setupExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "설치 파일 생성됨: $setupExe"

      - name: 설치 파일 시험 — 자동 설치(무음)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $log = "C:\yc_install_log.txt"
          try {
            $p = Start-Process -FilePath $env:SETUP_EXE -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\yc_install","/LOG=$log") -PassThru
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "자동 설치 실패 (종료 코드 $($p.ExitCode))" }
            if (-not (Test-Path "C:\yc_install\YesonCheck_Autocut.exe")) { throw "설치 후 YesonCheck_Autocut.exe가 없습니다" }
            if (-not (Test-Path "C:\yc_install\_internal")) { throw "설치 후 _internal 폴더가 없습니다" }
            # 라이선스(GPL-3.0)·제3자 고지: 실행 파일 옆(yesoncheck.iss)과 _internal(spec)
            foreach ($f in @("LICENSE", "THIRD_PARTY_NOTICES.md")) {
              foreach ($path in @("C:\yc_install\$f", "C:\yc_install\_internal\$f")) {
                if (-not (Test-Path $path)) { throw "설치 후 ${f}이 없습니다: $path" }
              }
            }
            $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Yeson Checker.lnk"
            if (-not (Test-Path $startMenu)) { throw "시작 메뉴 바로 가기가 없습니다: $startMenu" }
            $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "Yeson Checker.lnk"
            if (-not (Test-Path $desktop)) { throw "바탕 화면 바로 가기가 없습니다: $desktop" }
            Write-Host "설치·바로 가기 확인 완료"
          } catch {
            if (Test-Path $log) { Write-Host "===== 설치 로그 ($log)"; Get-Content $log -Encoding utf8 | Write-Host }
            throw
          }

      - name: 설치 파일 시험 — 설치된 exe 실행 시험
        run: ./ci/run_smoke_test.ps1 -Exe C:\yc_install\YesonCheck_Autocut.exe -Workdir C:\yc_smoke

      - name: 설치 파일 시험 — 업데이트(같은 Setup 재실행)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dummy = "C:\yc_install\_internal\__stale_from_old_build.txt"
          Set-Content -Path $dummy -Value "stale" -Encoding utf8
          $log2 = "C:\yc_install_log_upgrade.txt"
          try {
            $p = Start-Process -FilePath $env:SETUP_EXE -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\yc_install","/LOG=$log2") -PassThru
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "업데이트 설치 실패 (종료 코드 $($p.ExitCode))" }
            if (Test-Path $dummy) { throw "업데이트 후에도 예전 _internal 파일이 남아 있습니다: $dummy" }
            if (-not (Test-Path "C:\yc_install\YesonCheck_Autocut.exe")) { throw "업데이트 후 YesonCheck_Autocut.exe가 없습니다" }
            Write-Host "업데이트(교체) 확인 완료"
          } catch {
            if (Test-Path $log2) { Write-Host "===== 업데이트 설치 로그 ($log2)"; Get-Content $log2 -Encoding utf8 | Write-Host }
            throw
          }

      - name: 설치 파일 시험 — 무음 제거
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $uninst = "C:\yc_install\unins000.exe"
          if (-not (Test-Path $uninst)) { throw "제거 프로그램이 없습니다: $uninst" }
          $log3 = "C:\yc_uninstall_log.txt"
          try {
            $p = Start-Process -FilePath $uninst -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$log3") -PassThru
            $p.WaitForExit()
            # unins000.exe는 자신을 임시 폴더로 복사해 실제 제거를 맡기고 먼저 끝나 버리므로,
            # 설치 폴더의 exe가 실제로 사라질 때까지 따로 기다린다
            $deadline = (Get-Date).AddSeconds(60)
            while ((Test-Path "C:\yc_install\YesonCheck_Autocut.exe") -and ((Get-Date) -lt $deadline)) {
              Start-Sleep -Seconds 2
            }
            if (Test-Path "C:\yc_install\YesonCheck_Autocut.exe") { throw "제거 후에도 YesonCheck_Autocut.exe가 남아 있습니다 (시간 초과)" }
            $settingsPath = Join-Path $env:APPDATA "YesonCheck\settings.json"
            if (-not (Test-Path $settingsPath)) { throw "제거 후 PC별 설정이 사라졌습니다 (지우면 안 됨): $settingsPath" }
            Write-Host "무음 제거·설정 보존 확인 완료"
          } catch {
            if (Test-Path $log3) { Write-Host "===== 제거 로그 ($log3)"; Get-Content $log3 -Encoding utf8 | Write-Host }
            throw
          }

      - name: 업데이트 끝까지 시험 — 설치한 앱이 99.0.0으로 업데이트, 잘 켜지지 않는 새 버전은 되돌림 (ci/update_e2e.py)
        # 새 버전 설치 파일 둘(99.0.0·98.0.0)을 ISCC로 함께 컴파일(약 7분) → 원래 설치 파일로 깐 옛 앱이 시험 공유의
        # updates/에서 받아 도우미에 넘김 → 도우미가 조용히 설치·새 앱 확인(되돌리기 경로는 되돌림)
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # 시험 데이터의 영상은 받아 둔 ffmpeg로 (ci/make_test_data.py)
          $env:PATH = "$PWD\vendor\ffmpeg\windows;$env:PATH"
          .venv\Scripts\python.exe ci\update_e2e.py --platform windows --app-dist dist\YesonCheck_Autocut --installer $env:SETUP_EXE --iscc $env:ISCC_PATH --share-root "$env:YC_TEST_SHARE_ROOT\yc_update" --unc "$env:YC_TEST_UNC\yc_update" --work C:\yc_update

      - name: 설치 파일 artifact 이름
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "SETUP_ARTIFACT_NAME=YesonCheck_Setup_Windows_$($env:INSTALLER_FILE_TAG)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SETUP_ARTIFACT_NAME }}
          path: ${{ env.SETUP_EXE }}
          retention-days: 14
          if-no-files-found: error

  mac:
    # PyInstaller는 다른 아키텍처용으로 빌드할 수 없음 → 아키텍처마다 그 러너에서 build_app.sh (BUILD.md 5절)
    name: mac (${{ matrix.label }})
    strategy:
      # 한쪽이 실패해도 다른 쪽은 끝까지 → 두 아키텍처의 문제를 한 번에 봄
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: AppleSilicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        # bash -eo pipefail: 여러 줄 단계에서 중간 명령이 실패해도 단계가 실패하도록
        shell: bash
    env:
      # build_app.sh가 venv Python의 아키텍처로 정하는 앱·dmg 이름의 꼬리 — 아래 빌드 환경 단계에서 맞는지 확인
      LABEL: ${{ matrix.label }}
    steps:
      - name: 작업 시작 시각 (충돌 보고서를 이 job 것만 고르려고)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # 버전(tools/write_build_info.py)을 git 태그로 정함 → 전체 기록과 태그를 받음 (기본은 커밋 하나만)
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      - name: 디스크 여유 (시작)
        # 러너 디스크가 작음(문서상 14 GB) — 빌드 환경(Paddle·TensorFlow) + 앱 + dmg가 들어가는지 기록
        run: df -h /

      - name: ffmpeg (정적 9.0.2, sha256 확인)
        run: ./fetch_ffmpeg.sh

      - name: 빌드 환경 (Python 3.10, 아키텍처별 lock — setup_build_env.sh)
        run: |
          # 저장소 밖(러너 임시 폴더)에 만듦 → 작업 폴더가 깨끗하게 남아 버전 끝에 .dirty가 붙지 않음
          export VENV="$RUNNER_TEMP/p310_tf"
          ./setup_build_env.sh
          # 소스 시험용 (앱·빌드에는 들어가지 않음)
          uv pip install --python "$VENV/bin/python" -r requirements-test.txt
          # 러너가 아니라 venv Python의 아키텍처로 lock·앱 이름이 정해짐 → 이 job의 라벨과 같아야 함
          ARCH="$("$VENV/bin/python" -c 'import platform; print(platform.machine())')"
          case "$LABEL/$ARCH" in
            AppleSilicon/arm64 | Intel/x86_64) echo "아키텍처: $ARCH ($LABEL)" ;;
            *) echo "이 job($LABEL)과 빌드 환경 Python의 아키텍처($ARCH)가 맞지 않습니다"; exit 1 ;;
          esac
          echo "VENV=$VENV" >> "$GITHUB_ENV"
          echo "ARCH=$ARCH" >> "$GITHUB_ENV"

      - name: 소스 시험 (pytest)
        run: |
          "$VENV/bin/python" -m pytest tests -v -rs

      - name: 앱 빌드 (build_app.sh — 빌드 정보·PyInstaller·두 검사·라이선스·dmg)
        run: |
          # CI는 저장소 파일을 바꾸지 않음 → 커밋 안 된 변경이 있으면 버전 끝에 .dirty가 붙고
          # vX.Y.Z 태그 빌드도 배포판 X.Y.Z가 되지 못하므로 빌드 전에 멈춤
          if [ -n "$(git status --porcelain)" ]; then
            echo "작업 폴더에 커밋 안 된 변경이 있습니다:"
            git status --porcelain
            exit 1
          fi
          PY="$VENV/bin/python" ./build_app.sh

      - name: 빌드 버전 (build/build_info.json → 파일 이름 꼬리)
        run: |
          # build_app.sh가 만들어 앱에 넣은 파일에서 읽음 (write_build_info.py를 다시 돌리지 않음 — 빌드 시각이 바뀜)
          BUILD_VERSION="$("$VENV/bin/python" -c 'import json; print(json.load(open("build/build_info.json", encoding="utf-8"))["version"])')"
          # 파일 이름 꼬리는 write_build_info.py의 file_tag와 같은 규칙 (배포판이면 X.Y.Z, 아니면 커밋 7자리)
          FILE_TAG="$("$VENV/bin/python" -c 'import json, sys; sys.path.insert(0, "tools"); from write_build_info import file_tag; info = json.load(open("build/build_info.json", encoding="utf-8")); print(file_tag(info["version"], info["commit"]))')"
          # 커밋 안 된 변경이 있는 채로 만든 빌드(.dirty)는 file_tag가 커밋 7자리가 됨 → vX.Y.Z 태그 빌드도 이름이 조용히
          # 커밋으로 바뀌므로 멈춤 (앞 단계의 '작업 폴더가 깨끗한지' 확인 뒤에 바뀐 것 — 무엇인지 보여 줌)
          case "$BUILD_VERSION" in
            *.dirty) echo "커밋 안 된 변경이 있는 채로 빌드됐습니다: $BUILD_VERSION"; git status --porcelain; exit 1 ;;
          esac
          TAG_RE='^([0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{7})$'
          if ! [[ "$FILE_TAG" =~ $TAG_RE ]]; then
            echo "파일 이름 꼬리가 X.Y.Z나 커밋 7자리가 아닙니다: $FILE_TAG"
            exit 1
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "FILE_TAG=$FILE_TAG" >> "$GITHUB_ENV"
          echo "빌드 버전: $BUILD_VERSION (파일 이름 꼬리 $FILE_TAG)"

      - name: 실행 시험 데이터 (러너 임시 폴더에 공유 설정·한글 작품 폴더·시험 영상)
        run: |
          # 시험 영상은 받아 둔 정적 ffmpeg로 만듦 (러너에 ffmpeg가 있든 없든)
          export PATH="$PWD/vendor/ffmpeg/$ARCH:$PATH"
          # --expect-version: 실행 시험이 앱이 읽은 버전(앱 안의 build_info.json)과 창 제목도 확인
          "$VENV/bin/python" ci/make_test_data.py --share-root "$RUNNER_TEMP/yc" --mac-root "$RUNNER_TEMP/yc" --workdir "$RUNNER_TEMP/yc_smoke" --expect-version "$BUILD_VERSION"

      - name: 실행 시험 (빌드된 앱)
        run: |
          APP="dist/YesonCheck_Autocut_${LABEL}.app/Contents/MacOS/YesonCheck_Autocut"
          WORKDIR="$RUNNER_TEMP/yc_smoke"
          LIMIT=1500  # 초 — Windows의 ci/run_smoke_test.ps1과 같음
          # macOS에는 timeout 명령이 없음 → perl이 alarm을 건 뒤 같은 프로세스에서 앱으로 exec (alarm은 exec 뒤에도 남음).
          # LIMIT초 안에 끝나지 않으면 앱이 SIGALRM으로 끝나고 종료 코드 142(128+14) — 대화상자 등에 멈춰도 job 시간을 다 쓰지 않게
          STATUS=0
          QT_QPA_PLATFORM=offscreen YESONCHECK_CONFIG_DIR="$RUNNER_TEMP/yc/.yesoncheck" \
            perl -e 'alarm shift @ARGV; exec @ARGV or die "실행할 수 없습니다: $ARGV[0]: $!\n"' "$LIMIT" "$APP" --smoke-test "$WORKDIR" || STATUS=$?
          # 성공해도 결과를 남김 (애니매틱2 (TransNetV2)의 "cuts": [0, 30, 60] 등을 로그에서 확인)
          if [ -f "$WORKDIR/smoke_result.json" ]; then
            echo "===== $WORKDIR/smoke_result.json"
            cat "$WORKDIR/smoke_result.json"
            echo  # 파일 끝에 줄바꿈이 없음 → 아래 메시지가 같은 줄에 붙지 않게
          else
            echo "smoke_result.json 없음"
          fi
          if [ "$STATUS" -eq 142 ]; then
            echo "실행 시험이 ${LIMIT}초 안에 끝나지 않았습니다 (대화상자에서 멈췄을 수 있음)"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "실행 시험 실패 (종료 코드 $STATUS)"
            exit 1
          fi

      - name: 업데이트 끝까지 시험 — 빌드된 앱이 99.0.0으로 업데이트, 잘 켜지지 않는 새 버전은 되돌림 (ci/update_e2e.py)
        # 빌드된 앱을 러너 임시 폴더에 ditto한 옛 앱이 가짜 공유 설정의 updates/에서 dmg를 받아 도우미에 넘김 →
        # 도우미가 바꾸고 새 앱을 직접 켜 확인(되돌리기 경로는 되돌림)
        timeout-minutes: 30
        run: |
          # 시험 데이터의 영상은 받아 둔 정적 ffmpeg로 (ci/make_test_data.py)
          export PATH="$PWD/vendor/ffmpeg/$ARCH:$PATH"
          "$VENV/bin/python" ci/update_e2e.py --platform mac --app-dist "dist/YesonCheck_Autocut_${LABEL}.app" --work "$RUNNER_TEMP/yc_update"

      - name: dmg 이름 (YesonCheck_Autocut_<라벨>_<파일 이름 꼬리>.dmg)
        run: |
          DMG="dist/YesonCheck_Autocut_${LABEL}_${FILE_TAG}.dmg"
          mv "dist/YesonCheck_Autocut_${LABEL}.dmg" "$DMG"
          ls -l "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          echo "DMG_ARTIFACT_NAME=YesonCheck_Autocut_${LABEL}_${FILE_TAG}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG_ARTIFACT_NAME }}
          path: ${{ env.DMG_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: 충돌 보고서 (실패했을 때 — 죽은 스레드의 네이티브 스택)
        # 파이썬 스택(PYTHONFAULTHANDLER)으로는 paddle·TensorFlow 안의 어느 함수에서 죽었는지 모름 → macOS가 남긴 .ips에서 출력.
        # 러너 이미지에 원래 있던 다른 프로그램의 보고서는 빼고 이 job 동안 생긴 우리 프로세스(소스 실행·빌드된 앱) 것만.
        # 빌드 환경이 없을 때도 돌도록 러너의 python3로 (표준 라이브러리만 씀)
        if: failure()
        run: python3 ci/print_crash_reports.py --since "$JOB_START_EPOCH" --process python3 --process YesonCheck_Autocut

      - name: 디스크 여유 (끝)
        if: always()
        run: df -h /
